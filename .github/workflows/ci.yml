name: academy-ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install workspace dependencies
        run: npm ci
      - name: Install backend dependencies
        run: npm ci --prefix apps/backend
      - name: Check backend contracts are up to date
        run: npm --prefix apps/backend run contracts:check
      - name: Lint civilization runtime
        run: npm run lint -- --filter=@liceu/civilization-runtime
      - name: Test civilization runtime
        run: npm run test:workspace -- --filter=@liceu/civilization-runtime
      - run: docker compose build
