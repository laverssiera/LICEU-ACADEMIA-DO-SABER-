name: CI — Academia do Saber

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ────────────────────────────────────────────────────────
  # 1. Testes Node.js (src/app.js + test/)
  # ────────────────────────────────────────────────────────
  test-node:
    name: Node.js Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  # ────────────────────────────────────────────────────────
  # 2. Lint Python (api/main.py)
  # ────────────────────────────────────────────────────────
  test-python:
    name: Python API Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r api/requirements.txt
          pip install pytest httpx

      - name: Syntax check
        run: python -m py_compile api/main.py && echo "✓ Sem erros de sintaxe"

      - name: Import check (FastAPI startup)
        run: |
          cd api
          python -c "import main; print('✓ FastAPI importado com sucesso')"

  # ────────────────────────────────────────────────────────
  # 3. Build Docker images
  # ────────────────────────────────────────────────────────
  build-docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [test-node, test-python]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build academy-api (FastAPI)
        run: docker build -t academy-api:ci ./api

      - name: Build academy-node (Node/Express)
        run: docker build -t academy-node:ci -f Dockerfile.node .

      - name: Build academy-desk (React)
        run: docker build -t academy-desk:ci ./frontend

  # ────────────────────────────────────────────────────────
  # 4. Smoke test — full stack com docker compose
  # ────────────────────────────────────────────────────────
  smoke-test:
    name: Smoke Test (full stack)
    runs-on: ubuntu-latest
    needs: build-docker

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start stack
        run: |
          docker compose up -d --build
          echo "Aguardando serviços..."
          sleep 20

      - name: Health check — FastAPI
        run: |
          curl -f http://localhost:8010/ || (docker compose logs academy-api && exit 1)

      - name: Health check — Node API
        run: |
          curl -f http://localhost:3000/ || (docker compose logs academy-node && exit 1)

      - name: Health check — Frontend
        run: |
          curl -f http://localhost:8080/ || (docker compose logs academy-desk && exit 1)

      - name: Smoke — RBAC endpoint
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "x-holding-user-id: HLD-001" \
            http://localhost:8010/academy/courses)
          [ "$STATUS" = "200" ] || (echo "Falhou com $STATUS" && exit 1)

      - name: Stop stack
        if: always()
        run: docker compose down -v
