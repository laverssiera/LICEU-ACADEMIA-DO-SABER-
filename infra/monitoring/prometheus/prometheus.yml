global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: civilization-runtime
    static_configs:
      - targets:
          - civilization-runtime:8910

  - job_name: academia-runtime
    static_configs:
      - targets:
          - academia-runtime:8000
