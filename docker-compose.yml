services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: liceu
      POSTGRES_PASSWORD: liceu
      POSTGRES_DB: academia
    ports:
      - "5432:5432"
    volumes:
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  nats:
    image: nats:2.10-alpine
    command: "-js"
    ports:
      - "4222:4222"
      - "8222:8222"

  backend:
    build: ./apps/backend
    ports:
      - "3000:3000"
    depends_on:
      - postgres
      - redis
      - nats

  ai-engine:
    build: ./apps/ai-engine
    ports:
      - "8140:8140"
    depends_on:
      - postgres
      - redis
      - nats

  realtime:
    build: ./apps/realtime
    ports:
      - "8150:8150"
    depends_on:
      - nats

  frontend:
    build: ./apps/frontend
    ports:
      - "8080:3000"

  mobile:
    build: ./apps/mobile
    ports:
      - "8090:8090"

  admin:
    build: ./apps/admin
    ports:
      - "8160:8160"

  simulation-engine:
    build: ./apps/simulation-engine
    ports:
      - "8100:8100"

  ai-learning-engine:
    build: ./apps/ai-learning-engine
    ports:
      - "8110:8110"

  holographic-engine:
    build: ./apps/holographic-engine
    ports:
      - "8120:8120"

  streaming-engine:
    build: ./apps/streaming-engine
    ports:
      - "8130:8130"
